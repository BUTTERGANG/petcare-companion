<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PetCare Companion{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paw: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .timeline-dot { width: 12px; height: 12px; border-radius: 50%; position: absolute; left: -6px; top: 4px; }
        .timeline-line { position: absolute; left: 0; top: 20px; bottom: -20px; width: 2px; }
        .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900">
    <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="/" class="text-xl font-bold text-paw-600 dark:text-paw-400">
                            🐾 PetCare
                        </a>
                    </div>
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-6">
                        <a href="/" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-700 dark:text-gray-300 border-b-2 border-transparent hover:border-paw-500 hover:text-paw-600 dark:hover:text-paw-400">
                            Dashboard
                        </a>
                        <a href="/dogs/add" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-700 dark:text-gray-300 border-b-2 border-transparent hover:border-paw-500 hover:text-paw-600 dark:hover:text-paw-400">
                            + Add Dog
                        </a>
                        <a href="/breeds" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-700 dark:text-gray-300 border-b-2 border-transparent hover:border-paw-500 hover:text-paw-600 dark:hover:text-paw-400">
                            Breed Reference
                        </a>
                        <a href="/symptom-checker" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-700 dark:text-gray-300 border-b-2 border-transparent hover:border-paw-500 hover:text-paw-600 dark:hover:text-paw-400">
                            🏥 Symptom Checker
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <!-- Mobile nav -->
        <div class="sm:hidden border-t border-gray-200 dark:border-gray-700">
            <div class="flex space-x-2 px-4 py-2">
                <a href="/" class="text-sm text-gray-600 dark:text-gray-400 hover:text-paw-600">Dashboard</a>
                <a href="/dogs/add" class="text-sm text-gray-600 dark:text-gray-400 hover:text-paw-600">+ Add Dog</a>
                <a href="/breeds" class="text-sm text-gray-600 dark:text-gray-400 hover:text-paw-600">Breeds</a>
                <a href="/symptom-checker" class="text-sm text-gray-600 dark:text-gray-400 hover:text-paw-600">Symptom Checker</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Simple dark mode toggle
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
