<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — PetCare Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paw: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0',
                            300: '#86efac', 400: '#4ade80', 500: '#22c55e',
                            600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900">
    <div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div class="text-center">
                <div class="text-6xl mb-4">🐾</div>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white">PetCare Companion</h1>
                <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">Sign in to manage your pets' health</p>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-8">
                {% if error %}
                <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 dark:bg-red-900/20 text-sm text-red-700 dark:text-red-300">
                    {{ error }}
                </div>
                {% endif %}
                <form method="post" action="/login" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                        <input type="password" name="password" required autofocus
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500 focus:border-transparent"
                               placeholder="Enter your password">
                    </div>
                    <button type="submit"
                            class="w-full px-6 py-3 bg-paw-600 text-white font-medium rounded-lg hover:bg-paw-700 transition">
                        Sign In
                    </button>
                </form>
                <p class="mt-4 text-xs text-gray-500 dark:text-gray-400 text-center">
                    First time? Any password you enter becomes your login.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
