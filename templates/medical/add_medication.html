{% extends "base.html" %}
{% block title %}Add Medication — {{ dog.name }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
    <a href="/dogs/{{ dog.id }}" class="text-sm text-paw-600 dark:text-paw-400 hover:underline">&larr; Back to {{ dog.name }}</a>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mt-2 mb-6">💊 Add Medication</h1>
    <form method="post" action="/dogs/{{ dog.id }}/medications/add" class="space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Medication Name *</label>
            <input type="text" name="name" required placeholder="e.g., Rimadyl, Apoquel, Heartguard"
                   class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Dosage</label>
                <input type="text" name="dosage" placeholder="e.g., 25mg, 1 tablet"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Frequency</label>
                <input type="text" name="frequency" placeholder="e.g., 2x daily with food"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Start Date</label>
                <input type="date" name="start_date"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">End Date</label>
                <input type="date" name="end_date"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
            </div>
        </div>
        <div class="flex items-center">
            <input type="checkbox" name="is_active" value="true" id="active" checked
                   class="h-4 w-4 text-paw-600 focus:ring-paw-500 border-gray-300 rounded">
            <label for="active" class="ml-2 text-sm text-gray-700 dark:text-gray-300">Currently active</label>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Notes</label>
            <textarea name="notes" rows="3" placeholder="Reason, side effects, special instructions"
                      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500"></textarea>
        </div>
        <div class="flex items-center space-x-3">
            <button type="submit" class="px-6 py-2 bg-paw-600 text-white font-medium rounded-lg hover:bg-paw-700 transition">Save Medication</button>
            <a href="/dogs/{{ dog.id }}" class="px-6 py-2 text-gray-600 dark:text-gray-300 hover:text-gray-900 font-medium">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
