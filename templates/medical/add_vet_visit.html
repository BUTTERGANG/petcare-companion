{% extends "base.html" %}
{% block title %}Add Vet Visit — {{ dog.name }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
    <a href="/dogs/{{ dog.id }}" class="text-sm text-paw-600 dark:text-paw-400 hover:underline">&larr; Back to {{ dog.name }}</a>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mt-2 mb-6">🏥 Record Vet Visit</h1>
    <form method="post" action="/dogs/{{ dog.id }}/vet-visits/add" enctype="multipart/form-data" class="space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Date *</label>
            <input type="date" name="date_str" required
                   class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Reason for Visit *</label>
            <input type="text" name="reason" required placeholder="e.g., Annual checkup, limping, vomiting"
                   class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Vet / Clinic</label>
            <input type="text" name="vet_name" placeholder="e.g., VCA Animal Hospital"
                   class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Cost ($)</label>
            <input type="number" step="0.01" name="cost" placeholder="0.00"
                   class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Notes</label>
            <textarea name="notes" rows="4" placeholder="Diagnosis, treatment plan, follow-up instructions..."
                      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Attachments (receipts, lab results)</label>
            <input type="file" name="attachments" multiple accept=".pdf,.jpg,.jpeg,.png,.heic"
                   class="w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-paw-50 dark:file:bg-paw-900 file:text-paw-700 dark:file:text-paw-300 hover:file:bg-paw-100">
        </div>
        <div class="flex items-center space-x-3">
            <button type="submit" class="px-6 py-2 bg-paw-600 text-white font-medium rounded-lg hover:bg-paw-700 transition">Save Visit</button>
            <a href="/dogs/{{ dog.id }}" class="px-6 py-2 text-gray-600 dark:text-gray-300 hover:text-gray-900 font-medium">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
