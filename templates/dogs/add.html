{% extends "base.html" %}
{% block title %}Add Dog — PetCare Companion{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">Add a New Pet</h1>
    <!-- Species picker -->
    <div class="flex gap-2 mb-6">
        {% for s in species_list %}
        <a href="/dogs/add?species={{ s.slug }}"
           {% if current_species and s.id == current_species.id %}class="px-5 py-2.5 rounded-xl font-semibold bg-paw-600 text-white shadow-soft"{% else %}class="px-5 py-2.5 rounded-xl font-medium bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 hover:bg-paw-50 dark:hover:bg-gray-700 transition"{% endif %}>
            {{ s.icon }} {{ s.name }}
        </a>
        {% endfor %}
    </div>
    <form method="post" action="/dogs/add" enctype="multipart/form-data" class="space-y-5">
        {% if current_species %}
        <input type="hidden" name="species_id" value="{{ current_species.id }}">
        {% endif %}
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Name *</label>
            <input type="text" name="name" required
                   class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500 focus:border-transparent">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Breed</label>
            <select name="breed_id"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
                <option value="">Select a breed...</option>
                {% for b in breeds %}
                <option value="{{ b.id }}">{{ b.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Date of Birth</label>
                <input type="date" name="dob"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Weight (kg)</label>
                <input type="number" step="0.1" name="weight"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Sex</label>
                <select name="sex"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
                    <option value="">Select...</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Microchip ID</label>
                <input type="text" name="microchip_id"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500">
            </div>
        </div>
        <div class="flex items-center">
            <input type="checkbox" name="spayed_neutered" value="true" id="spayed"
                   class="h-4 w-4 text-paw-600 focus:ring-paw-500 border-gray-300 rounded">
            <label for="spayed" class="ml-2 text-sm text-gray-700 dark:text-gray-300">Spayed / Neutered</label>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Photo</label>
            <input type="file" name="photo" accept="image/*"
                   class="w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-paw-50 dark:file:bg-paw-900 file:text-paw-700 dark:file:text-paw-300 hover:file:bg-paw-100">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Notes</label>
            <textarea name="notes" rows="3"
                      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-paw-500"></textarea>
        </div>
        <div class="flex items-center space-x-3">
            <button type="submit" class="px-6 py-2 bg-paw-600 text-white font-medium rounded-lg hover:bg-paw-700 transition">
                Save Dog
            </button>
            <a href="/" class="px-6 py-2 text-gray-600 dark:text-gray-300 hover:text-gray-900 font-medium">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
